<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sensible Sage</title>
  <style>

    body {
      background-color: #F3EFE6;
      color: #33392E;
      font-family: Georgia, serif;
      margin: 0;
      padding: 0;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: #FFFFFF;
    }

    nav .logo {
      font-size: 22px;
      font-weight: bold;
      color: #5C7346;
    }

    nav ul {
      display: flex;
      gap: 30px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: #33392E;
      text-decoration: none;
    }

    nav a:hover {
      color: #5C7346;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      padding: 60px 40px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .hero-text {
      flex: 1;
    }

    .hero-image {
      flex: 1;
    }

    .hero-image img {
      width: 100%;
      border-radius: 12px;
    }

    h1 {
      color: #5C7346;
      font-size: 48px;
      margin-bottom: 8px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      background-color: #5C7346;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #47592F;
    }

    /* ---- MENU SECTION ---- */
    /* display: none means "don't show this at all" - not even blank space.
       JavaScript will change this to display: block when the button is clicked. */
    #menu-section {
      display: none;
      max-width: 700px;
      margin: 0 auto 60px auto;
      padding: 0 40px;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #DDD5C4;
    }

    .menu-item-name {
      font-size: 18px;
    }

    .menu-item-price {
      font-size: 18px;
      color: #5C7346;
    }

    @media (max-width: 700px) {
      .hero {
        flex-direction: column;
      }
      nav {
        flex-direction: column;
        gap: 16px;
      }
    }

    body.dark-mode {
      background-color: #1A1D17;
      color: #E8E4D9;
    }

    body.dark-mode nav {
      background-color: #24281E;
    }

    body.dark-mode nav a {
      color: #E8E4D9;
    }

  </style>
</head>
<body>

  <nav>
    <div class="logo">Sensible Sage</div>
    <ul>
      <li><a href="#">Shop</a></li>
      <li><a href="#">Our Story</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="hero-text">
      <h1>Sensible Sage</h1>
      <p>Slow-grown herbs, small-batch remedies, and a little more calm in your day.</p>
      <!-- id="menu-button" gives this element a unique name JavaScript can grab onto -->
      <button id="menu-button">See Our Menu</button>
      <!-- our new second button, with its own unique id -->
      <button id="thanks-button" style="background-color: #A9764A; margin-left: 10px;">Say Hi</button>
      <button id="Sage-Advice-button" style="background-color: #8B6F47; margin-left: 10px;">Get Sage Advice</button>
      <button id="Random-Tip-Generator" style="background-color: #6B8E5A; margin-left: 10px;">Generate Random Tip</button>
      <button id="Dark-Mode-Button" style="position: fixed; bottom: 20px; left: 20px; width: 48px; height: 48px; border-radius: 50%; background-color: #333; font-size: 22px; padding: 0; display: flex; align-items: center; justify-content: center; z-index: 100;">☀️</button>
    </div>
    <div class="hero-image">
      <img src="https://images.unsplash.com/photo-1515586000433-45406d8e6662?w=600" alt="Dried herbs and sage in a bowl">
    </div>
  </section>

  <!-- This whole section starts hidden (see CSS above) -->
  <section id="menu-section">
    <h2>Our Menu</h2>
    <div class="menu-item">
      <span class="menu-item-name">Chamomile Calm Tea</span>
      <span class="menu-item-price">$12</span>
    </div>
    <div class="menu-item">
      <span class="menu-item-name">Sage & Lemon Tincture</span>
      <span class="menu-item-price">$24</span>
    </div>
    <div class="menu-item">
      <span class="menu-item-name">Lavender Sleep Balm</span>
      <span class="menu-item-price">$18</span>
    </div>
  </section>

  <script>
    // Step 1: "grab" the button and the menu section from the page by their id
    const menuButton = document.getElementById('menu-button');
    const menuSection = document.getElementById('menu-section');

    // Step 2: tell the browser "when this button is clicked, run this function"
    menuButton.addEventListener('click', function() {

      // Step 3: check the menu's current state, and flip it
      if (menuSection.style.display === 'block') {
        menuSection.style.display = 'none';   // hide it if it's showing
        menuButton.textContent = 'See Our Menu';
      } else {
        menuSection.style.display = 'block';  // show it if it's hidden
        menuButton.textContent = 'Hide Menu';
      }

    });

    // ---- Our second, brand-new button ----
    // Same 3 ingredients: an HTML element (added above), find it, listen for a click
    const thanksButton = document.getElementById('thanks-button');

    thanksButton.addEventListener('click', function() {
      alert('The Sensible Sage says Hi and thanks for stopping by!');
    });

    // ----- Third button: Get Sage Advice -----
    // Line A: "find" the button using the exact same id you gave it in HTML
    const sageAdviceButton = document.getElementById('Sage-Advice-button');
    // Line B: tell it what to do when clicked
    sageAdviceButton.addEventListener('click', function() {
      alert('The Sensible Sage has some wisdom to share! Do not try to arouse or awaken love. It will do so when it desires.');
    });

    // Fourth Button: Generate Random Tip
    const randomTipButton = document.getElementById('Random-Tip-Generator');
    randomTipButton.addEventListener('click', function() {
      const tips = [
        "Take a deep breath and center yourself.",
        "Listen to your body and give it what it needs.",
        "Practice gratitude for the small things in life.",
        "Too err is human."
      ];
      const randomTip = tips[Math.floor(Math.random() * tips.length)];
      alert(randomTip);
    });

    // Fifth Button: Toggle Dark Mode
    const darkModeButton = document.getElementById('Dark-Mode-Button');
    darkModeButton.addEventListener('click', function() {
      document.body.classList.toggle('dark-mode');

      // check current state, swap the icon to match
      if (document.body.classList.contains('dark-mode')) {
        darkModeButton.textContent = '🌙';
      } else {
        darkModeButton.textContent = '☀️';
      }
    });
  </script>

</body>
</html>
